[source]
primary_url = "http://dispatcharr-one.example:9191/output/epg/Plex-Regional-1?cachedlogos=false"
fallback_url = "http://dispatcharr-two.example:9192/output/epg/Plex-Regional-2?cachedlogos=false"
timeout_seconds = 30
max_bytes = 33554432
refresh_seconds = 900

[server]
listen_host = "0.0.0.0"
port = 9193

[storage]
state_dir = "/state"

[enrichment]
series_categories = [
  "Series", "Serie", "Kochdokusoap", "Dokusoap", "Doku-Soap",
  "Comedyserie", "Krimiserie", "Soap", "Telenovela", "Dokureihe",
  "Dokumentationsreihe", "Daily Soap", "Gerichtsshow", "Gerichtssoap",
  "Krempelsoap", "Realityserie", "Realityshow", "Dating-Doku",
  "True-Crime-Dokureihe"
]
series_titles = [
  "Das perfekte Dinner", "First Dates - Ein Tisch für zwei",
  "Das Sommerhaus der Stars - Kampf der Promipaare"
]
movie_categories = ["Film", "Spielfilm", "Movie", "Kinofilm", "Kurzfilm"]

[resolver]
enabled = true
language = "de"
country = "DE"
minimum_series_confidence = 0.92
minimum_episode_confidence = 0.95
ambiguity_margin = 0.08
catalog_ttl_hours = 168
negative_ttl_hours = 24
max_series_lookups_per_refresh = 50

# Credentials are read from these environment variables at runtime. Never put
# API keys or subscriber PINs in this file.
[providers.thetvdb]
enabled = true
api_key_env = "THETVDB_API_KEY"
pin_env = "THETVDB_PIN"

[providers.tmdb]
enabled = false
api_key_env = "TMDB_READ_TOKEN"

[providers.tvmaze]
enabled = true

# Overrides are durable identity declarations, not episode guesses. The
# numbering model controls how a source value such as E121 may be compared to
# provider episodes: catalog, year, or absolute.
[series_overrides."Das perfekte Dinner"]
provider = "thetvdb"
series_id = "266543"
numbering = "catalog"

[test_tuner]
enabled = false
