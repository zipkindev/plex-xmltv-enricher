[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "plex-xmltv-enricher"
version = "0.4.0"
description = "Conservative provider-backed XMLTV episode resolver for Plex DVR"
requires-python = ">=3.13"
license = "0BSD"
authors = [{name = "plex-xmltv-enricher contributors"}]
dependencies = []

[project.scripts]
plex-xmltv-enricher = "plex_xmltv_enricher.cli:main"

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.13.1", "mypy==1.18.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["plex_xmltv_enricher"]
